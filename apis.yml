aid: cosm
name: Cosm
description: 'Cosm is a Los Angeles-based immersive technology, media and entertainment
  company formed in 2020 from the merger of LiveLike VR (now Cosm Immersive) and C360,
  followed by the acquisition of planetarium pioneers Evans & Sutherland and Spitz.
  It operates three lines: Cosm Tech (the CX System LED dome, Digistar planetarium
  software, and end-to-end immersive display systems sold to planetariums, museums
  and attractions), Cosm Media (immersive content production and licensing through
  Cosm Studios) and Cosm Venues (the "Shared Reality" experiential venues in Los Angeles
  and Dallas, with Atlanta, Detroit and Cleveland following). Cosm sells and operates
  systems and venues rather than a developer platform: it publishes no public API,
  SDK, developer portal or machine-readable specification. The one API it markets —
  the Digistar scripting/automation interface, advertised as "the most fully featured
  API across the planetarium industry" — is documented only inside the customer support
  portal at partners.cosm.com, which requires a login.'
